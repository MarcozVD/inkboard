name: Release (M4)

# Tags + manual runs only; D4: unsigned beta (no Windows certs / macOS notarization).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # NSIS + MSI
            args: ''
          - platform: macos-latest # universal binary (aarch64 + x86_64)
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04 # AppImage + deb
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: node scripts/check-versions.mjs

      - name: Require updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Fail in seconds on malformed secrets (e.g. a UTF-8 BOM added by
        # PowerShell). Never echo or persist the secret values themselves.
        run: |
          set -euo pipefail
          fail() { echo "::error::TAURI updater secret problem: $1"; exit 1; }
          key=${TAURI_SIGNING_PRIVATE_KEY:-}
          pass=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}
          [ -n "$key" ] || fail "TAURI_SIGNING_PRIVATE_KEY is empty or not set (Settings → Secrets and variables → Actions)."
          [ -n "$pass" ] || fail "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty or not set."

          # UTF-8 BOM (EF BB BF) at the start of either value
          case $key in $'\xef\xbb\xbf'*) fail "TAURI_SIGNING_PRIVATE_KEY starts with a UTF-8 BOM. Store it as pure base64 (Linux: base64 -w0 inkboard-updater.key)." ;; esac
          case $pass in $'\xef\xbb\xbf'*) fail "TAURI_SIGNING_PRIVATE_KEY_PASSWORD starts with a UTF-8 BOM." ;; esac

          # carriage returns and trailing whitespace/newlines
          case $key in *$'\r'*) fail "TAURI_SIGNING_PRIVATE_KEY contains carriage returns (\\r) — likely pasted from a CRLF file." ;; esac
          case $pass in *$'\r'*) fail "TAURI_SIGNING_PRIVATE_KEY_PASSWORD contains carriage returns (\\r)." ;; esac
          [[ $key =~ [[:space:]]$ ]] && fail "TAURI_SIGNING_PRIVATE_KEY ends with whitespace/newline."
          [[ $pass =~ [[:space:]]$ ]] && fail "TAURI_SIGNING_PRIVATE_KEY_PASSWORD ends with whitespace/newline."

          # must decode as base64 (GNU and BSD agree on -d)...
          decoded=$(printf '%s' "$key" | tr -d '\n' | base64 -d 2>/dev/null) \
            || fail "TAURI_SIGNING_PRIVATE_KEY is not valid base64 (it must be the base64 of the minisign secret key file)."
          # ...into a minisign secret key ("untrusted comment" header; a BOM
          # inside the decoded text also fails this check)
          case $decoded in
            *"untrusted comment"*) ;;
            *) fail "decoded TAURI_SIGNING_PRIVATE_KEY is not a minisign secret key (expected to contain 'untrusted comment')." ;;
          esac
          echo "Updater signing secrets present and well-formed."

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Inkboard v__VERSION__'
          releaseBody: 'Unsigned beta (D4). Download the installer for your platform.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
