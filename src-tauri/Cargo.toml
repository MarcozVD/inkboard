[package]
name = "inkboard"
version = "0.1.0"
description = "Inkboard — infinite whiteboard app (Tauri 2 + SvelteKit)"
authors = ["Inkboard"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "inkboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
# M4-01: window geometry + single instance
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# M4-05: updates (D4: unsigned beta)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
log = "0.4"

# Fase 11 — Persistencia
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"
sha2 = "0.10"

# Fase 13 — Importación
zip = "2.1"

# M2-08 — Re-encode de imágenes importadas (strip metadata)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }

# M2-10 — PDF vectorial desde el SVG (D2); versions must match svg2pdf 0.12 (usvg 0.43)
svg2pdf = "0.12"
usvg = { version = "0.43", default-features = false, features = ["text", "system-fonts"] }
fontdb = { version = "0.21", features = ["fs"] }

# M4-08 — RNF-06: release binary budget < 15 MB
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
